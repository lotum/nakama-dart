name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - nakama
          - nakama/example
          - satori
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ matrix.package }}

      - name: Check formatting
        run: dart format --set-exit-if-changed .
        working-directory: ${{ matrix.package }}

      - name: Analyze
        run: dart analyze --fatal-infos
        working-directory: ${{ matrix.package }}

      - name: Start test server
        run: docker compose up -d
        working-directory: nakama/test/test_server
        if: matrix.package == 'nakama'

      - name: Run tests
        run: dart test --concurrency 1
        working-directory: ${{ matrix.package }}
        if: matrix.package == 'nakama'

      - name: Build Flutter app (web)
        run: flutter build web
        working-directory: ${{ matrix.package }}
        if: matrix.package == 'nakama/example'

      - name: Build Flutter app (web,wasm)
        run: flutter build web --wasm
        working-directory: ${{ matrix.package }}
        if: matrix.package == 'nakama/example'